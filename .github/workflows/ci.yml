name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest -q

      - name: Check Python syntax
        run: |
          python -m compileall \
            agents.py \
            streamlit_app.py \
            src \
            scripts


  docker:

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t docuchat-ai:ci \
            .

      - name: Start container
        run: |
          docker run \
            -d \
            --name docuchat-ai \
            -p 7860:7860 \
            docuchat-ai:ci

      - name: Check Streamlit health
        shell: bash
        run: |
          healthy=false

          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              http://127.0.0.1:7860/_stcore/health
            then
              echo ""
              echo "DocuChat AI is healthy."
              healthy=true
              break
            fi

            echo "Waiting for Streamlit..."
            sleep 2
          done

          if [ "$healthy" != "true" ]; then
            echo "Application failed to start."
            docker logs docuchat-ai
            exit 1
          fi

      - name: Show Docker logs
        if: always()
        run: |
          docker logs docuchat-ai || true

      - name: Stop container
        if: always()
        run: |
          docker rm -f docuchat-ai || true
